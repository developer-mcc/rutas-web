# Sitio de producción. Copiar a /etc/nginx/conf.d/viaja.conf
# y las rutas a /etc/nginx/snippets/viaja-locations.conf.
# Reemplazar "midominio.pe" y las rutas de los certificados (Let's Encrypt / certbot).

# Spring Boot escucha solo en el equipo local (SERVER_ADDRESS=127.0.0.1).
upstream viaja_api {
    server 127.0.0.1:8080;
}

limit_req_zone $binary_remote_addr zone=viaja_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=viaja_cotizaciones:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name midominio.pe www.midominio.pe;

    # certbot renueva certificados por aquí
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name midominio.pe www.midominio.pe;

    ssl_certificate     /etc/letsencrypt/live/midominio.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/midominio.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS solo tiene sentido en HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/snippets/viaja-locations.conf;
}
