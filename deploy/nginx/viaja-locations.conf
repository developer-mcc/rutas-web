# Rutas compartidas por los bloques server de HTTPS (y por la prueba local en HTTP).
# Se incluye dentro de un bloque server: include /etc/nginx/snippets/viaja-locations.conf;

root /var/www/viaja/app;
index index.html;

# Cabeceras de seguridad. "always" para que también salgan en respuestas de error.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

server_tokens off;
client_max_body_size 6m;

# Angular: cualquier ruta que no sea un archivo cae en index.html (incluye /admin/**).
location / {
    try_files $uri $uri/ /index.html;
}

# index.html nunca se cachea para que un despliegue nuevo se vea de inmediato.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

# Nota: en Nginx, si un bloque location define add_header, deja de heredar los del bloque server.
# Por eso el bloque de index.html repite todas las cabeceras de seguridad.

# Los archivos de Angular llevan hash en el nombre: se pueden cachear un año.
location ~* \.(?:js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# API (Spring Boot). El upstream viaja_api se define en cada sitio (viaja.conf o el de pruebas locales).
location /api/ {
    proxy_pass http://viaja_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 30s;
}

# Login: límite de peticiones por IP contra fuerza bruta (se suma al bloqueo de la aplicación).
location = /api/auth/login {
    limit_req zone=viaja_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://viaja_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
}

# Cotizaciones públicas: límite por IP contra spam.
location = /api/cotizaciones {
    limit_req zone=viaja_cotizaciones burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://viaja_api;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
}

# Imágenes subidas desde el admin: las sirve Nginx directamente desde disco.
location /uploads/ {
    alias /var/www/viaja/uploads/;
    expires 30d;
    add_header Cache-Control "public" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Aunque alguien lograra subir otro tipo de archivo, el navegador no lo ejecuta.
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    autoindex off;
    try_files $uri =404;
}
