# Sitio para el despliegue local con Docker. Usa exactamente las mismas rutas que producción
# (viaja-locations.conf); solo cambia dónde está la API y que no hay HTTPS.
upstream viaja_api {
    server api:8080;
}

limit_req_zone $binary_remote_addr zone=viaja_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=viaja_cotizaciones:10m rate=10r/m;

server {
    listen 80;
    include /etc/nginx/snippets/viaja-locations.conf;
}
