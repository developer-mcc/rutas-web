<section class="vehicle" id="confort" aria-labelledby="confort-title">
  <div class="wrap vehicle-grid">
    <div>
      <div class="kicker">{{ site.texto('confort.kicker') }}</div>
      <h2 id="confort-title">{{ site.texto('confort.titulo') }}</h2>
      <p class="lead">{{ site.texto('confort.lead') }}</p>
      <div class="features">
        @for (item of items(); track item.id) {
          <div class="feature">
            <b>{{ item.icono }} {{ item.titulo }}</b>
            <span>{{ item.texto }}</span>
          </div>
        }
      </div>
    </div>
    <div class="vehicle-photo">
      <img
        [src]="site.texto('confort.imagen')"
        [alt]="site.texto('confort.imagen_alt')"
        loading="lazy"
        decoding="async"
      />
    </div>
  </div>
</section>
