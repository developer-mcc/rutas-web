# Análisis estático del frontend:
#   sonar-scanner -Dsonar.host.url=<servidor> -Dsonar.token=<token>
sonar.projectKey=rutas-web
sonar.projectName=Iri Travel Peru - Web
sonar.sources=src
sonar.exclusions=**/node_modules/**,src/styles.css,src/app/admin/admin.css
# El proyecto no usa pruebas automatizadas: no se mide cobertura.
sonar.coverage.exclusions=**/*
sonar.sourceEncoding=UTF-8
